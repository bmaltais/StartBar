# shellcheck shell=bash
# StartBar's settings for the devkit (scripts/devkit, a submodule; docs/testing.md): the test session, the tours and the recorder.
TOUR_TITLE=StartBar
TOUR_PLUGIN_ID=io.github.bmaltais.startbar
TOUR_PLUGIN_WIDGET=0                      # a service: loaded, not put on the Omarchy bar
# What the test session's Dock starts with: its defaults, plus the clock, and no Pins, Start Pins or Placed positions. The tours
# start from the state the README shows (scripts/tours/common.sh).
TOUR_PLUGIN_ENTRY='{"showClock":true}'
TOUR_SANDBOX_LINK=(.local/share/icons)    # nothing of the real config is copied: the settings and Pins are in the sandbox's shell.json
TOUR_REAL_UNCHANGED=(.config/omarchy/shell.json .local/share/applications)
DEVKIT_NAME=startbar

# One look for every recording, screenshot and test session, past, present and future: Omarchy's "ethereal" theme (dark blue, peach text)
# with its "1-cosmic" wallpaper, whatever theme the person running it has chosen. The devkit links the real current theme into the sandbox;
# devkit_sandbox replaces that link with a copy of the theme, from Omarchy's own files, so nothing of the machine's own look leaks in.
# The session's screen is pinned too (the recordings' size): TOUR_SIZE=WxH for a tour, DEV_SIZE=WxH for `dev up`, to try another for one run.
: "${TOUR_SIZE:=1280x800}"
: "${DEV_SIZE:=1280x800}"
TOUR_THEME=ethereal
TOUR_BACKGROUND=1-cosmic.webp
devkit_sandbox() {
  local h=$1 src=${OMARCHY_PATH:-/usr/share/omarchy}/themes/$TOUR_THEME cur=$1/.local/state/omarchy/current
  [[ -f $src/backgrounds/$TOUR_BACKGROUND ]] || { echo "devkit: the pinned look needs $src/backgrounds/$TOUR_BACKGROUND (TOUR_THEME and TOUR_BACKGROUND in devkit.conf)" >&2; return 1; }
  rm -rf "$cur"
  mkdir -p "$cur/theme"
  cp -a "$src/." "$cur/theme/"
  ln -s "$cur/theme/backgrounds/$TOUR_BACKGROUND" "$cur/background"
  echo "$TOUR_THEME" >"$cur/theme.name"
}
DEVKIT_LAYERS=(omarchy-startbar-settings)  # the settings window is a layer of its own; the Start menu is part of the Dock's (below)

# The Start menu is part of the Dock's own surface, so the Dock says whether it is open.
devkit_window_up() { layer_mapped omarchy-startbar-settings || nenv omarchy-shell "$TOUR_PLUGIN_ID" layout 2>/dev/null | jq -e '.menus.start != null' >/dev/null 2>&1; }

DEVKIT_USAGE='  dev startmenu | settings | close   open the Start menu or the settings window there, or close both
  dev layout                  where the Dock'"'"'s Items and any open menu are, as JSON pixels of the session'"'"'s screen
  dev clients                 the session'"'"'s windows, one line each: address, class, workspace, position, size, floating, fullscreen
  dev menu                    the open menus (item, bar, barSub, preview, start) as x y w h in session pixels, or "none"
  dev preserve-split          set dwindle'"'"'s preserve_split, which a fresh session lacks and tile reshaping (snap layouts) needs'
dev_cmd_startmenu() { nenv omarchy-shell -q "$ID" closeStartMenu 2>/dev/null || true; sleep 0.4; dev_window startmenu "$ID" startMenu; }
dev_cmd_settings() { dev_window settings "$ID" settings; }
dev_cmd_close() { nenv omarchy-shell -q "$ID" closeStartMenu; nenv omarchy-shell -q "$ID" closeSettings; echo "dev close: closed"; }
dev_cmd_layout() { nenv omarchy-shell "$ID" layout; }
dev_cmd_clients() {
  nenv hyprctl -j clients | jq -r '.[] | "\(.address) \(.class) ws=\(.workspace.name) at=\(.at[0]),\(.at[1]) size=\(.size[0])x\(.size[1]) floating=\(.floating) fs=\(.fullscreen)"'
}
dev_cmd_menu() {
  nenv omarchy-shell "$ID" layout | jq -r '[.menus | to_entries[] | select(.value != null)]
    | if length == 0 then "none" else .[] | "\(.key) \(.value.x) \(.value.y) \(.value.width) \(.value.height)" end'
}
dev_cmd_preserve-split() {
  nenv hyprctl eval 'hl.config({ dwindle = { preserve_split = true } })' >/dev/null && echo "dev preserve-split: on"
}

# `pointer key` sends keys only to these windows: the screenshot recorder's and the spare window `scripts/spare open` starts.
DEVKIT_KEY_CLASSES=(startbar-screenshot spare-test)
# The pre-commit hook may commit on any branch here (a release is a pull request into main, docs/agents/release.md).
DEVKIT_PROTECT_BRANCHES=()

# `try-setting` with no command (scripts/try-setting): show the Dock the setting produced.
try_default() { omarchy-shell io.github.bmaltais.startbar layout | jq -c .; }

# `check` (scripts/check) runs these after its own steps: shell scripts, the devkit's rules, qmllint, the manifest.
devkit_check() {
  step "source file size (scripts/check-file-size.sh, what the pre-commit hook enforces)" scripts/check-file-size.sh --all
  step "model, settings, guard, docs (node --test)" node --test
}
