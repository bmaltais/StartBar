name: Check

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The manifest and QML checks in `npm run check` need Omarchy and Qt,
      # which this runner doesn't have; they run in the pre-commit hook.
      - run: npm test
